# The full stack: Kafka, Spark, Postgres, Airflow.
#
# `make demo` runs the same pipeline without any of this, on SQLite, in about a
# second. That is not a lesser version to fall back on -- it is the one that runs
# in CI on every push, because a test suite that needs four containers up is a
# test suite that stops being run. This file is for exercising the distributed
# path and for showing the thing working end to end.
#
#   docker compose up -d
#   docker compose run --rm producer
#   open http://localhost:8088   (airflow / airflow)

name: dispatch

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://dispatch:dispatch@postgres:5432/airflow
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    # The pipeline's own warehouse, which is a different database from the one
    # Airflow keeps its metadata in. Sharing them is how a metadata migration
    # takes the warehouse with it.
    DISPATCH_DSN: postgresql://dispatch:dispatch@postgres:5432/dispatch
    PYTHONPATH: /opt/dispatch
  volumes:
    - ./dags:/opt/airflow/dags
    - ./dispatch:/opt/dispatch/dispatch
    - ./transforms:/opt/dispatch/transforms
    - ./generator:/opt/dispatch/generator
    - ./data:/opt/dispatch/data
    - ./logs:/opt/airflow/logs
  working_dir: /opt/dispatch
  depends_on:
    postgres:
      condition: service_healthy

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: dispatch
      POSTGRES_DB: dispatch
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      # pg_isready alone returns true while the init scripts are still running,
      # so a dependent container can connect before the second database exists.
      test: ["CMD-SHELL", "pg_isready -U dispatch -d dispatch && psql -U dispatch -d airflow -c 'select 1'"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    # apache/kafka, not bitnami/kafka. Bitnami withdrew its images from Docker
    # Hub's public catalog, so bitnami/kafka:3.7 no longer resolves at all --
    # the compose file was written against an image that has since vanished.
    #
    # The settings are the same ones; the names are not. Bitnami prefixed every
    # broker property with KAFKA_CFG_, the official image uses KAFKA_ directly,
    # and a property under the wrong name is silently ignored rather than
    # rejected.
    image: apache/kafka:3.7.0
    ports: ["9092:9092"]
    environment:
      # KRaft: no ZooKeeper. One less container, and one less thing that can be
      # the reason the stack does not come up on someone else's laptop.
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Three partitions so a consumer group has something to balance and the
      # per-trip keying is exercised rather than being a no-op.
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_LOG_RETENTION_HOURS: "168"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: dispatch-local-cluster-1
    healthcheck:
      # Full path: the official image does not put the CLI on PATH, so the bare
      # command the bitnami one accepted fails here with "not found" -- which
      # reads as an unhealthy broker rather than a wrong healthcheck.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 15
    volumes:
      - kafkadata:/var/lib/kafka/data

  kafka-setup:
    image: apache/kafka:3.7.0
    depends_on:
      kafka:
        condition: service_healthy
    # Auto-create is off, so the topic is declared here with the partition count
    # and retention it is meant to have, rather than being conjured with
    # defaults by whichever client connects first.
    command: >
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
      --topic trip_events --partitions 3 --replication-factor 1
      --config retention.ms=604800000
    restart: on-failure

  producer:
    build: {context: ., dockerfile: Dockerfile}
    depends_on:
      kafka-setup: {condition: service_completed_successfully}
    command: >
      python -m generator.produce --trips 20000 --days 21
      --bootstrap kafka:9092 --topic trip_events
    volumes:
      # The code, not just the data. The image installs dependencies and sets
      # PYTHONPATH but never COPYs the source -- every other service mounts it,
      # and this one did not, so `python -m generator.produce` could not find
      # the module it was told to run.
      - ./generator:/opt/dispatch/generator
      - ./dispatch:/opt/dispatch/dispatch
      - ./data:/opt/dispatch/data
    profiles: ["manual"]

  spark:
    # The -python3-ubuntu variant, not apache/spark:3.5.x. Those ship Python
    # 3.8, and the shared dispatch/ package uses the dict merge operator and
    # runtime type unions, both of which are newer than that. Neither shows up
    # until a real Spark job runs: the driver is fine, the executor is where the
    # core actually gets imported.
    #
    # Matching the runtime is also the right instinct on its own -- PySpark
    # wants the driver and executor on the same Python, and this stack develops
    # and tests on 3.11.
    image: spark:3.5.3-scala2.12-java17-python3-ubuntu
    depends_on:
      kafka: {condition: service_healthy}
    environment:
      SPARK_MODE: master
      PYTHONPATH: /opt/dispatch
      # --packages resolves through Ivy, which writes its cache under $HOME.
      # The image runs as a user whose home is not writable, so resolution died
      # before a single JAR was fetched -- with a FileNotFoundException about
      # its own cache file, which reads like a missing dependency and is not.
      HOME: /tmp
    ports: ["8081:8080"]
    volumes:
      - ./streaming:/opt/dispatch/streaming
      - ./dispatch:/opt/dispatch/dispatch
      - ./data:/opt/dispatch/data
    command: >
      /opt/spark/bin/spark-submit --master local[2]
      --conf spark.jars.ivy=/tmp/.ivy2
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0
      /opt/dispatch/streaming/ingest.py
      --bootstrap kafka:9092 --bronze /opt/dispatch/data/bronze
      --checkpoint /opt/dispatch/data/_checkpoints/ingest --once
    profiles: ["manual"]

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - airflow db migrate && airflow users create --username airflow
        --password airflow --firstname d --lastname e --role Admin --email d@e.local

  airflow-webserver:
    <<: *airflow-common
    command: airflow webserver
    # 8088 on the host, not 8080. 8080 is the most contended port on any
    # development machine -- a leaked binding from an earlier failed start
    # held it here with nothing visible in `docker ps` or netstat, and the
    # only way to reclaim it was restarting Docker Desktop. The container
    # still listens on 8080; only the published port moved.
    ports: ["8088:8080"]
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10

  airflow-scheduler:
    <<: *airflow-common
    command: airflow scheduler
    depends_on:
      airflow-init: {condition: service_completed_successfully}

volumes:
  pgdata:
  kafkadata:
